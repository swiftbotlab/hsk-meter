[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
cache_path = "cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
offline = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
lint_on_build = false

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 200
fail_on_revert = false
